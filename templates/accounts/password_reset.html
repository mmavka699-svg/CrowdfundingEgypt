{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:420px;">
    <div class="card shadow-sm p-4">
        <h3 class="mb-3">Reset your password</h3>
        <p class="text-muted">Enter your email and we'll send you a link to reset your password.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.email }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Send Reset Link</button>
        </form>
    </div>
</div>
{% endblock %}
