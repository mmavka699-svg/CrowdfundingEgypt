{% extends "base.html" %}
{% block title %}Check Your Email — Crowd-Funding Egypt{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:480px;">
    <div class="form-card text-center" data-animate="fade-up">
        <div class="stat-icon bg-success-subtle text-success mx-auto mb-3" style="width:60px; height:60px; font-size:1.75rem;">
            <i class="bi bi-envelope-check-fill"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Check your inbox</h3>
        <p class="text-muted mb-4">We've sent password reset instructions to your email address. Please check your inbox and spam folder.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-pill shadow-sm">Return to Login</a>
    </div>
</div>
{% endblock %}
