<div style="font-family: Arial, sans-serif; max-width: 600px; margin: auto;">
    <h2 style="color:#2563eb;">Password Reset Request</h2>
    <p>We received a request to reset your Crowd-Funding Egypt password.</p>
    <p>
        <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}"
           style="background:#2563eb;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;display:inline-block;">
            Reset My Password
        </a>
    </p>
    <p style="font-size:13px;color:#666;">If you didn't request this, you can safely ignore this email.</p>
</div>
