{% extends "base.html" %}
{% block title %}Resend Activation Email — Crowd-Funding Egypt{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:440px;">
    <div class="form-card" data-animate="fade-up">
        <div class="text-center mb-4">
            <span class="stat-icon bg-primary-subtle text-primary mx-auto mb-3" style="width:50px; height:50px; font-size:1.5rem;">
                <i class="bi bi-envelope-check-fill"></i>
            </span>
            <h3 class="fw-bold text-dark mb-1">Resend Activation</h3>
            <p class="text-muted small">Enter your email to receive a new 24-hour account verification link.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 btn-pill shadow-sm mb-3">
                <i class="bi bi-send me-1"></i> Send New Link
            </button>
            <a href="{% url 'accounts:login' %}" class="btn btn-light w-100 btn-pill">Back to Login</a>
        </form>
    </div>
</div>
{% endblock %}
