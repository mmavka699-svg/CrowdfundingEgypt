{% extends "base.html" %}
{% block title %}Password Reset Complete — Crowd-Funding Egypt{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:480px;">
    <div class="form-card text-center" data-animate="fade-up">
        <div class="stat-icon bg-success-subtle text-success mx-auto mb-3" style="width:60px; height:60px; font-size:1.75rem;">
            <i class="bi bi-check-circle-fill"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Password Reset Complete!</h3>
        <p class="text-muted mb-4">Your account password has been updated successfully. You may now log in with your new password.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-pill shadow-sm">Log In Now</a>
    </div>
</div>
{% endblock %}
