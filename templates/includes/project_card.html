{% load static %}
<div class="col-sm-6 col-lg-3">
    <div class="card project-card h-100">
        <a href="{{ project.get_absolute_url }}">
            <img src="{% if project.images.first %}{{ project.images.first.image.url }}{% else %}{% static 'img/placeholder.jpg' %}{% endif %}"
                 class="card-img-top" alt="{{ project.title }}">
        </a>
        <div class="card-body d-flex flex-column">
            <span class="badge bg-light text-dark mb-2 align-self-start">{{ project.category.name }}</span>
            <h5 class="card-title">
                <a href="{{ project.get_absolute_url }}" class="text-decoration-none text-dark">{{ project.title|truncatechars:40 }}</a>
            </h5>
            <div class="progress my-2" style="height:8px;">
                <div class="progress-bar bg-success" style="width:{{ project.progress_percentage }}%"></div>
            </div>
            <div class="d-flex justify-content-between small text-muted mb-2">
                <span>{{ project.total_donated }} EGP raised</span>
                <span>{{ project.progress_percentage }}%</span>
            </div>
            <div class="mt-auto d-flex justify-content-between align-items-center">
                <span class="small text-warning"><i class="fa-solid fa-star"></i> {{ project.average_rating }}</span>
                <span class="small text-muted">{{ project.days_left }} days left</span>
            </div>
        </div>
    </div>
</div>
